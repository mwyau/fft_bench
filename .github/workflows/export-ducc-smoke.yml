name: Export exact DUCC sources for local smoke test
on:
  push:
    branches: [test/export-ducc-real-smoke-20261124]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mwyau/ducc
          ref: f80b987891bd34d367c414dc2f27a13e42f4cb94
          persist-credentials: false
      - run: git rev-parse HEAD && tar -czf ducc-source.tar.gz src
      - uses: actions/upload-artifact@v4
        with:
          name: ducc-smoke-source
          path: ducc-source.tar.gz
